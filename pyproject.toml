[project]
name = "shared-auth-lib"
version = "0.36.0"
description = "Shared authorization library for ThinkRealty microservices"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.104.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
    "starlette>=0.27.0",
    "tr-shared-lib[http,logging]>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.25.0",
    "ruff>=0.4.0",
    "freezegun>=1.2.0",
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    # Test-only. install_standard_middleware installs tr_shared's
    # APIIdempotencyMiddleware, which imports redis; the guard proving that layer
    # sits INSIDE HMAC (the tr-lead-management DoS) cannot run without it.
    # Not a runtime dependency — the import is lazy and only the idempotency
    # branch reaches it.
    "redis>=5.0.0",
    # Test-only, same reason: tr_shared.rate_limiter imports the monitoring
    # instruments at module scope, so the RateLimitMiddleware branch of the
    # factory cannot be exercised without OpenTelemetry present.
    "tr-shared-lib[monitoring]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared_auth_lib"]

[tool.uv.sources]
tr-shared-lib = { git = "https://github.com/ThinkReality/tr-shared-lib.git", tag = "v0.69.0" }

[tool.ruff]
line-length = 85
target-version = "py313"

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=shared_auth_lib --cov-report=term-missing"

[tool.coverage.run]
source = ["shared_auth_lib"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
